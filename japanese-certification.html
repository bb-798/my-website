<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>能力認證｜日文</title>

  <style>
    :root {
      --paper: #F7F6F1;
      --ink: #282C29;
      --sky: #A9D0DC;
      --jade: #46634D;
      --green-jade: #4B897D;
      --blue: #34799A;
      --deep-blue: #3C5577;
      --brown: #816C4D;
      --gold: #E8C477;

      --content-width: 1180px;

      --font-main:
        "Noto Sans TC",
        "Noto Sans JP",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      --font-display:
        "Noto Sans TC",
        "Noto Sans JP",
        system-ui,
        sans-serif;

      --font-english:
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-main);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      width: 100%;
      height: 88px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5vw;
    }

    .header-back {
      font-size: 30px;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .header-back:hover {
      transform: translateX(-5px);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .language-switcher {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .language-button,
    .menu-button {
      border: none;
      background: none;
      color: var(--ink);
      padding: 0;
      cursor: pointer;
    }

    .language-button {
      font-family: var(--font-main);
      font-size: 14px;
      opacity: 0.45;
    }

    .language-button.active {
      opacity: 1;
    }

    .menu-button {
      font-family: Arial, sans-serif;
      font-size: 24px;
      line-height: 1;
    }

    main {
      width: min(var(--content-width), 90vw);
      margin: 0 auto;
      padding: 55px 0 120px;
    }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 60px;
      margin-bottom: 75px;
    }

    .label {
      font-size: 13px;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
      opacity: 0.55;
    }

    .title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 500;
      line-height: 1.1;
    }

    .intro-text {
      max-width: 430px;
      margin: 0;
      font-size: 15px;
      line-height: 2;
      opacity: 0.7;
    }

    .section {
      margin-top: 80px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
    }

    .section-title {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
    }

    .section-note {
      margin: 0;
      font-size: 13px;
      opacity: 0.5;
    }

    /* 橫向滾動 */

    .certificate-scroll {
      display: flex;
      gap: 28px;
      overflow-x: auto;
      padding: 5px 0 28px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: var(--sky) transparent;
    }

    .certificate-scroll::-webkit-scrollbar {
      height: 5px;
    }

    .certificate-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .certificate-scroll::-webkit-scrollbar-thumb {
      background: var(--sky);
      border-radius: 10px;
    }

    .certificate {
      flex: 0 0 auto;
      width: min(560px, 72vw);
      scroll-snap-align: start;
    }

    .certificate-image {
      width: 100%;
      background: #eee;
      overflow: hidden;
      cursor: pointer;
    }

    .certificate-image img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.35s ease;
    }

    .certificate-image:hover img {
      transform: scale(1.02);
    }

    .certificate-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin-top: 16px;
    }

    .certificate-name {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
    }

    .certificate-detail {
      margin: 0;
      font-size: 13px;
      opacity: 0.55;
      white-space: nowrap;
    }

    @media (max-width: 700px) {

      header {
        height: 72px;
        padding: 0 6vw;
      }

      .header-right {
        gap: 18px;
      }

      main {
        width: 88vw;
        padding-top: 35px;
      }

      .intro {
        display: block;
        margin-bottom: 60px;
      }

      .intro-text {
        margin-top: 28px;
      }

      .section {
        margin-top: 65px;
      }

      .certificate {
        width: 82vw;
      }

      .certificate-info {
        display: block;
      }

      .certificate-detail {
        margin-top: 7px;
      }
    }
  </style>
</head>

<body>

  <header>

    <!-- 返回日文頁 -->
    <a
      class="header-back"
      href="japanese.html"
      aria-label="返回日文">
      ←
    </a>

    <div class="header-right">

      <div class="language-switcher">

        <button
          class="language-button active"
          onclick="setLanguage('zh')">
          中
        </button>

        <button
          class="language-button"
          onclick="setLanguage('en')">
          EN
        </button>
        <button
          class="language-button"
          onclick="setLanguage('ja')">
          日
        </button>
      </div>
      <button
        class="menu-button"
        aria-label="選單">
        ☰
      </button>
    </div>
  </header>
  <main>
    <section class="intro">
      <div>
        <div
          class="label"
          data-zh="日文"
          data-en="Japanese"
          data-ja="日本語">
          日文
        </div>
        <h1
          class="title"
          data-zh="能力認證"
          data-en="Certification"
          data-ja="能力認定">
          能力認證
        </h1>
      </div>
      <p
        class="intro-text"
        data-zh="整理日文學習過程中的學歷、檢定與其他可被證明的成果。"
        data-en="Education, certifications and other documented achievements related to Japanese."
        data-ja="日本語学習に関する学歴、資格、その他の実績をまとめています。">
        整理日文學習過程中的學歷、檢定與其他可被證明的成果。
      </p>
    </section>
    <!-- 01 學歷 -->
    <section class="section">
      <div class="section-heading">
        <h2
          class="section-title"
          data-zh="學歷"
          data-en="Education"
          data-ja="学歴">
          學歷
        </h2>
        <p
          class="section-note"
          data-zh="在學中"
          data-en="Currently studying"
          data-ja="在学中">
          在學中
        </p>
      </div>
      <div class="certificate-scroll">
        <article class="certificate">
          <div class="certificate-image">
            <img
              src="images/japanese-education-01.jpg"
              alt="東吳大學日文系在學">
          </div>
          <div class="certificate-info">
            <h3
              class="certificate-name"
              data-zh="東吳大學日本語文學系"
              data-en="Department of Japanese Language and Culture"
              data-ja="東呉大学日本語文学科">
              東吳大學日本語文學系
            </h3>
            <p
              class="certificate-detail"
              data-zh="在學中"
              data-en="Currently studying"
              data-ja="在学中">
              在學中
            </p>
          </div>
        </article>
      </div>
    </section>
    <!-- 02 檢定 -->
    <section class="section">
      <div class="section-heading">
        <h2
          class="section-title"
          data-zh="檢定"
          data-en="Certifications"
          data-ja="資格">
          檢定
        </h2>
      </div>
      <div class="certificate-scroll">
        <article class="certificate">
          <div class="certificate-image">
            <img
              src="images/japanese-n2.jpg"
              alt="JLPT N2 證書">
          </div>
          <div class="certificate-info">
            <h3
              class="certificate-name"
              data-zh="JLPT N2"
              data-en="JLPT N2"
              data-ja="JLPT N2">
              JLPT N2
            </h3>
            <p
              class="certificate-detail"
              data-zh="日本語能力試驗"
              data-en="Japanese-Language Proficiency Test"
              data-ja="日本語能力試験">
              日本語能力試驗
            </p>
          </div>
        </article>
        <article class="certificate">
          <div class="certificate-image">
            <img
              src="images/japanese-certificate-02.jpg"
              alt="其他日文檢定">
          </div>
          <div class="certificate-info">
            <h3
              class="certificate-name"
              data-zh="其他檢定"
              data-en="Other certification"
              data-ja="その他の資格">
              其他檢定
            </h3>
            <p
              class="certificate-detail"
              data-zh="待補"
              data-en="To be added"
              data-ja="追加予定">
              待補
            </p>
          </div>
        </article>
      </div>
    </section>
    <!-- 03 其他 -->
    <section class="section">
      <div class="section-heading">
        <h2
          class="section-title"
          data-zh="其他"
          data-en="Other"
          data-ja="その他">
          其他
        </h2>
      </div>
      <div class="certificate-scroll">
        <article class="certificate">
          <div class="certificate-image">
            <img
              src="images/japanese-admission-03.jpg"
              alt="正取三錄取結果">
          </div>
          <div class="certificate-info">
            <h3
              class="certificate-name"
              data-zh="正取三"
              data-en="3rd-ranked admission"
              data-ja="正規合格 第3位">
              正取三
            </h3>
            <p
              class="certificate-detail"
              data-zh="錄取結果"
              data-en="Admission result"
              data-ja="合格結果">
              錄取結果
            </p>
          </div>
        </article>
        <article class="certificate">
          <div class="certificate-image">
            <img
              src="images/japanese-other-02.jpg"
              alt="其他日文相關成果">
          </div>
          <div class="certificate-info">
            <h3
              class="certificate-name"
              data-zh="其他成果"
              data-en="Other achievement"
              data-ja="その他の実績">
              其他成果
            </h3>
            <p
              class="certificate-detail"
              data-zh="待補"
              data-en="To be added"
              data-ja="追加予定">
              待補
            </p>
          </div>
        </article>
      </div>
    </section>
  </main>
  <footer></footer>
  <script>
    function setLanguage(language) {
      document
        .querySelectorAll("[data-zh]")
        .forEach(element => {
          const text =
            element.getAttribute("data-" + language);
          if (text !== null) {
            element.textContent = text;
          }
        });
      document
        .querySelectorAll(".language-button")
        .forEach(button => {
          button.classList.remove("active");
        });
      document
        .querySelector(
          `.language-button[onclick="setLanguage('${language}')"]`
        )
        .classList.add("active");
      document.documentElement.lang =
        language === "zh"
          ? "zh-Hant"
          : language === "ja"
            ? "ja"
            : "en";
    }
  </script>
</body>
</html>
