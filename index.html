<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人資料館</title>
  <style>
    /* =========================================================
       ↓↓↓ 只需要修改這裡 ↓↓↓
    ========================================================= */
    :root {
      /* ---------- 色彩 ---------- */
      --paper: #F7F6F1;
      --ink: #282C29;
      --sky: #A9D0DC;
      --jade: #46634D;
      --green-jade: #4B897D;
      --blue: #34799A;
      --deep-blue: #3C5577;
      --brown: #816C4D;
      --gold: #E8C477;
      /* ---------- 字體 ---------- */
      --font-main:
        "Noto Sans TC",
        "Noto Sans JP",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
      --font-display:
        "Noto Sans TC",
        "Noto Sans JP",
        system-ui,
        sans-serif;
      --font-english:
        "Helvetica Neue",
        Arial,
        sans-serif;
      /* ---------- 網頁寬度 ---------- */
      --content-width: 1180px;
    }
    /* =========================================================
       ↑↑↑ 修改到這裡就好
    ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-main);
      line-height: 1.7;
    }
    button,
    input,
    textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    /* =========================
       Header
    ========================= */
    header {
      width: min(var(--content-width), calc(100% - 80px));
      margin: 0 auto;
      padding: 34px 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
    }
    .site-name {
      font-family: var(--font-display);
      font-size: 25px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .language {
      display: flex;
      gap: 14px;
      font-family: var(--font-english);
      font-size: 13px;
    }
    .language button,
    .menu-button {
      border: 0;
      background: transparent;
      color: var(--ink);
      opacity: 0.65;
      transition: 0.2s;
    }
    .language button:hover,
    .language button.active,
    .menu-button:hover {
      color: var(--jade);
      opacity: 1;
    }
    .menu-button {
      letter-spacing: 0.08em;
    }
    /* =========================
       Main
    ========================= */
    main {
      width: min(var(--content-width), calc(100% - 80px));
      margin: 0 auto;
    }
    /* =========================
       個人資料
    ========================= */
    .profile {
      min-height: 430px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 80px;
      padding: 72px 0;
    }
    .profile-text {
      max-width: 580px;
    }
    .profile-label {
      margin-bottom: 18px;
      color: var(--brown);
      font-family: var(--font-english);
      font-size: 13px;
      letter-spacing: 0.18em;
    }
    .profile-name {
      margin-bottom: 18px;
      font-family: var(--font-display);
      font-size: clamp(42px, 6vw, 76px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: 0.04em;
    }
    .profile-description {
      color: color-mix(in srgb, var(--ink) 72%, transparent);
      font-size: 17px;
      max-width: 460px;
    }
    .profile-image {
      width: min(100%, 390px);
      aspect-ratio: 4 / 5;
      justify-self: end;
      overflow: hidden;
      background: color-mix(in srgb, var(--paper) 88%, var(--ink));
    }
    .profile-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    /* =========================
       分類切換
    ========================= */
    .category-nav {
      display: flex;
      gap: 38px;
      padding: 20px 0;
      border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
    }
    .category-button {
      position: relative;
      flex: 0 0 auto;
      border: 0;
      background: transparent;
      color: color-mix(in srgb, var(--ink) 55%, transparent);
      font-size: 15px;
      letter-spacing: 0.08em;
      padding: 4px 0;
      transition: 0.2s;
    }
    .category-button:hover,
    .category-button.active {
      color: var(--jade);
    }
    .category-button.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -21px;
      height: 2px;
      background: var(--jade);
    }
    /* =========================
       內容區
    ========================= */
    .content-area {
      min-height: 460px;
      padding: 60px 0 100px;
    }
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 34px;
    }
    .content-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .content-note {
      color: color-mix(in srgb, var(--ink) 45%, transparent);
      font-family: var(--font-english);
      font-size: 13px;
    }
    /* =========================
       圖文展示
    ========================= */
    .items {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 42px 28px;
    }
    .item {
      border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
      padding-top: 18px;
    }
    .item-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      margin-bottom: 16px;
      overflow: hidden;
      background: color-mix(in srgb, var(--paper) 88%, var(--ink));
    }
    .item-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.45s ease;
    }
    .item:hover img {
      transform: scale(1.035);
    }
    .item-category {
      margin-bottom: 5px;
      color: var(--green-jade);
      font-family: var(--font-english);
      font-size: 12px;
      letter-spacing: 0.12em;
    }
    .item-title {
      font-family: var(--font-display);
      font-size: 18px;
      margin-bottom: 4px;
    }
    .item-text {
      color: color-mix(in srgb, var(--ink) 58%, transparent);
      font-size: 14px;
    }
    /* =========================
       純文字列表
    ========================= */
    .text-list {
      border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
    }
    .text-list-item {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 25px;
      padding: 21px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    }
    .text-list-date {
      color: var(--brown);
      font-family: var(--font-english);
      font-size: 13px;
    }
    .text-list-title {
      font-family: var(--font-display);
      font-size: 16px;
    }
    .text-list-type {
      color: color-mix(in srgb, var(--ink) 42%, transparent);
      font-family: var(--font-english);
      font-size: 12px;
    }
    /* =========================
       Footer
    ========================= */
    footer {
      width: min(var(--content-width), calc(100% - 80px));
      margin: 0 auto;
      padding: 25px 0 45px;
      color: color-mix(in srgb, var(--ink) 42%, transparent);
      font-family: var(--font-english);
      font-size: 12px;
      border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    }
    /* =========================
       Responsive
    ========================= */
    @media (max-width: 800px) {
      header,
      main,
      footer {
        width: min(100% - 40px, var(--content-width));
      }
      header {
        padding-top: 24px;
      }
      .profile {
        grid-template-columns: 1fr;
        gap: 35px;
        padding: 55px 0;
      }
      .profile-image {
        width: min(100%, 340px);
        justify-self: start;
      }
      .profile-name {
        font-size: clamp(42px, 12vw, 62px);
      }
      .items {
        grid-template-columns: repeat(2, 1fr);
      }
      .text-list-item {
        grid-template-columns: 95px 1fr;
      }
      .text-list-type {
        display: none;
      }
    }
    @media (max-width: 520px) {
      .site-name {
        font-size: 20px;
      }
      .header-right {
        gap: 15px;
      }
      .language {
        gap: 8px;
      }
      .profile {
        padding: 45px 0;
      }
      .profile-description {
        font-size: 15px;
      }
      .category-nav {
        gap: 25px;
      }
      .items {
        grid-template-columns: 1fr;
      }
      .content-area {
        padding-top: 45px;
      }
      .content-header {
        display: block;
      }
      .content-note {
        display: block;
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="site-name">你的名字</div>
    <div class="header-right">
      <div class="language">

      <article class="item">

        </div>
        <div class="item-category">BEAUTY</div>
        <h3 class="item-title">彩妝</h3>

    </div>

  <!-- =========================
       紀錄
  ========================= -->
  <div class="category-content" id="records" style="display:none;">
  </div>
  <!-- =========================
       最近
  ========================= -->
  <div class="category-content" id="recent" style="display:none;">
    <div class="text-list">
      <div class="text-list-item">
        <span class="text-list-date">09 / 2026</span>

  <!-- =========================
       精選
  ========================= -->
  <div class="category-content" id="featured" style="display:none;">
  </div>
</section>
<div class="category-content" id="featured" style="display:none;">
</div>
      </div>
    </section>
  </main>
  <footer>
    個人資料館
  </footer>
  <script>
    function showCategory(category, button) {
      document.querySelectorAll(".category-content")
        .forEach(section => {
          section.style.display = "none";
        });
      document.getElementById(category).style.display = "block";
      document.querySelectorAll(".category-button")
        .forEach(btn => {
          btn.classList.remove("active");
        });
      button.classList.add("active");
    }
  </script>
</body>
</html>
